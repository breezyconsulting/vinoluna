<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VinoLuna — Biodynamic Wine Calendar</title>
<meta name="description" content="Is today a good day for wine? The biodynamic lunar calendar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,700;0,900;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#2A2A2A;--ink2:#5A5A5A;--ink3:#9A9A9A;
  --paper:#EBEBEB;--rule:#D0D0D0;
  --cream:#F2EBD9;--olive:#6B6B3A;--olive-light:#8E8E50;
  --wine:#6B1A2A;--wine-mid:#8C2438;--wine-pale:#D4A0A8;
}
html,body{background:var(--paper);min-height:100vh;}
body{color:var(--ink);font-family:'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}

/* ── Layout: mobile-first, expands desktop ── */
.outer{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:0 16px 64px;}

/* Mobile: single column */
.page{width:100%;max-width:480px;}

/* Desktop: two-column layout */
@media(min-width:900px){
  .outer{padding:0 48px 80px;gap:48px;align-items:flex-start;}
  .page{max-width:none;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto;gap:0 48px;padding-top:40px;}
  .col-left{grid-column:1;}
  .col-right{grid-column:2;}
  .full-width{grid-column:1/-1;}
}

/* Column wrappers */
.col-left,.col-right{display:flex;flex-direction:column;}

header{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:28px 0 10px;border-bottom:2px solid var(--ink);
  animation:fi .6s ease both;
}
@media(min-width:900px){header{padding-top:40px;}}

.wordmark{font-size:clamp(22px,2.5vw,28px);font-weight:700;letter-spacing:-.02em;
  transition:letter-spacing .4s cubic-bezier(.23,1,.32,1);cursor:default;}
.wordmark span{font-weight:300;}
.wordmark:hover{letter-spacing:.04em;}
.header-tagline{font-size:9px;font-weight:400;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;line-height:1.5;text-align:right;}

.datetime-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:32px;animation:fi .6s .1s ease both;opacity:0;}
.time-display{font-size:clamp(56px,12vw,88px);font-weight:900;letter-spacing:-.04em;line-height:.88;}
.date-col{text-align:right;padding-bottom:6px;}
.date-day{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
.date-full{font-size:11px;font-weight:300;color:var(--ink2);margin-top:2px;}
.location-row{font-size:10px;font-weight:400;color:var(--ink3);letter-spacing:.06em;margin-top:3px;}

.rule{height:1px;background:var(--rule);margin:16px 0;}
.rule-thick{height:2px;background:transparent;margin:16px 0;position:relative;overflow:hidden;}
.rule-thick::after{content:'';position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;animation:ruleIn .8s .3s cubic-bezier(.77,0,.18,1) forwards;}

.moon-strip{display:flex;justify-content:space-between;align-items:center;padding:8px 0;animation:fi .6s .2s ease both;opacity:0;}
.moon-label{font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);}
.moon-value{font-size:11px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:7px;color:var(--wine);}
.moon-icon{width:16px;height:16px;}
.moon-icon.spin-in{animation:moonSpin .55s cubic-bezier(.34,1.4,.64,1) both;}

/* ── Result card ── */
.result-block{
  margin-top:24px;border:2px solid var(--ink);padding:28px 24px 24px;
  position:relative;animation:fi .6s .25s ease both;opacity:0;
  transition:border-color .5s,background .5s;
}
.result-block.fruit {background:var(--cream);border-color:var(--wine);}
.result-block.flower{background:var(--cream);border-color:var(--olive);}
.result-block.leaf  {background:var(--paper);border-color:var(--olive-light);}
.result-block.root  {background:var(--paper);border-color:var(--ink3);}
@keyframes borderPulse{0%{outline:3px solid transparent;outline-offset:0;}40%{outline:3px solid var(--wine);outline-offset:3px;}100%{outline:3px solid transparent;outline-offset:6px;}}
.result-block.flash{animation:borderPulse .6s ease;}
.result-corner{position:absolute;top:10px;right:14px;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);}

/* Wine bottle animation container */
.result-type-row{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
.result-type-icon{width:64px;height:64px;flex-shrink:0;}
.result-type-icon.draw path,.result-type-icon.draw circle,.result-type-icon.draw ellipse{stroke-dasharray:500;stroke-dashoffset:500;animation:drawPath .8s cubic-bezier(.4,0,.2,1) forwards;}

/* Wine bottle floats to the right of result card on desktop */
.wine-bottle-wrap{
  position:absolute;right:20px;bottom:16px;
  width:44px;opacity:.18;
  transition:opacity .4s;
  pointer-events:none;
}
.result-block.fruit .wine-bottle-wrap,.result-block.flower .wine-bottle-wrap{opacity:.3;}
.wine-bottle-wrap svg{width:100%;height:auto;}
.wine-bottle-wrap.pour{animation:bottlePour .6s cubic-bezier(.34,1.2,.64,1) both;}
@keyframes bottlePour{0%{transform:rotate(0deg);}30%{transform:rotate(-22deg) translateX(-4px);}70%{transform:rotate(-18deg);}100%{transform:rotate(0deg);}}

/* Wine fill animation on verdict */
.wine-fill{
  position:absolute;bottom:0;left:0;right:0;
  height:0%;background:rgba(107,26,42,.06);
  transition:height 1s cubic-bezier(.23,1,.32,1);
  pointer-events:none;
}
.result-block.fruit .wine-fill,.result-block.flower .wine-fill{height:100%;}

.result-type-label{font-size:clamp(22px,5vw,30px);font-weight:900;letter-spacing:-.02em;text-transform:uppercase;line-height:1;transition:color .4s;}
.result-block.fruit  .result-type-label{color:var(--wine);}
.result-block.flower .result-type-label{color:var(--olive);}
.result-block.leaf   .result-type-label{color:var(--olive-light);}
.result-block.root   .result-type-label{color:var(--ink3);}
.result-type-label.slide-in{animation:labelSlide .4s cubic-bezier(.23,1,.32,1) both;}

.verdict-word{font-size:clamp(72px,18vw,108px);font-weight:900;letter-spacing:-.04em;line-height:.85;transition:color .4s;overflow:hidden;}
.result-block.fruit .verdict-word,.result-block.flower .verdict-word{color:var(--ink);}
.verdict-word.avoid{color:var(--ink3);}
.verdict-word .vflip{display:block;animation:verdictFlip .45s cubic-bezier(.23,1,.32,1) both;}
.verdict-sub{font-size:12px;font-weight:300;font-style:italic;color:var(--ink2);margin-top:10px;letter-spacing:.04em;transition:opacity .25s,transform .25s;}
.verdict-sub.hide{opacity:0;transform:translateY(4px);}

/* ── Dial ── */
.dial-section{margin-top:28px;animation:fi .6s .35s ease both;opacity:0;}
.section-label-wrap{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.section-label{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;}
.section-rule{flex:1;height:1px;background:var(--rule);transform:scaleX(0);transform-origin:left;animation:ruleIn .7s 1.1s ease forwards;}

.dial-wrapper{position:relative;width:100%;max-width:360px;aspect-ratio:1;margin:0 auto;}
@media(min-width:900px){.dial-wrapper{max-width:100%;}}
#dial-canvas{width:100%;height:100%;touch-action:none;cursor:grab;display:block;}
#dial-canvas:active{cursor:grabbing;}
.dial-wrapper::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;animation:dialBreath 4s ease-in-out infinite;}
@keyframes dialBreath{0%,100%{box-shadow:inset 0 0 0 1px rgba(107,26,42,.08);}50%{box-shadow:inset 0 0 0 2px rgba(107,26,42,.22);}}

.dial-center-info{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.dc-day{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;}
.dc-time{font-size:clamp(22px,6vw,32px);font-weight:900;letter-spacing:-.03em;color:var(--ink);line-height:1.1;}
.dc-period{font-size:9px;font-weight:400;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;}

/* ── Date navigator (below dial) ── */
.date-nav{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  animation:fi .6s .5s ease both;opacity:0;
}
.date-nav-btn{
  width:32px;height:32px;border:1px solid var(--rule);background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s,transform .2s;
  flex-shrink:0;
}
.date-nav-btn:hover{background:var(--ink);border-color:var(--ink);}
.date-nav-btn:hover svg path{stroke:#EBEBEB;}
.date-nav-btn:active{transform:scale(.92);}
.date-nav-btn svg{width:12px;height:12px;pointer-events:none;}
.date-nav-btn svg path{stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;transition:stroke .15s;}
.date-nav-center{text-align:center;flex:1;}
.date-nav-label{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);}
.date-nav-date{font-size:15px;font-weight:900;letter-spacing:-.01em;color:var(--ink);line-height:1.2;transition:opacity .2s;}
.date-nav-date.updating{opacity:0;}
.date-nav-today{
  font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--wine);margin-top:2px;opacity:0;transition:opacity .3s;
}
.date-nav-today.visible{opacity:1;}

/* ── Week strip ── */
.week-strip{display:flex;gap:4px;margin-top:12px;}
.week-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;cursor:pointer;border:1px solid transparent;transition:border-color .2s,background .2s,transform .2s cubic-bezier(.23,1,.32,1);}
.week-day:hover{background:rgba(42,42,42,.05);transform:translateY(-2px);}
.week-day.active{border-color:var(--ink);}
.wd-name{font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase;}
.week-day.active .wd-name{color:var(--ink);}
.wd-num{font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.02em;line-height:1;}
.wd-icon-wrap{width:18px;height:18px;}

/* ── Tasting note ── */
.tasting-block{padding:16px 0;border-bottom:1px solid var(--rule);animation:fi .6s .55s ease both;opacity:0;}
.tasting-kicker{font-size:9px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;}
.tasting-text{font-size:13px;font-weight:300;font-style:italic;color:var(--ink2);line-height:1.65;}
.tasting-text.fade-in{animation:tasteFade .5s ease both;}

/* ── Legend ── */
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:28px;border:1px solid var(--rule);animation:fi .6s .6s ease both;opacity:0;}
.legend-item{display:flex;align-items:flex-start;gap:12px;padding:16px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s,transform .25s cubic-bezier(.23,1,.32,1),box-shadow .25s;}
.legend-item:nth-child(2n){border-right:none;}
.legend-item:nth-child(3),.legend-item:nth-child(4){border-bottom:none;}
.legend-item[data-type="fruit"],.legend-item[data-type="flower"]{background:var(--cream);}
.legend-item:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.1);}
.li-icon{width:40px;height:40px;flex-shrink:0;margin-top:2px;}
.li-name{font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1;}
.legend-item[data-type="fruit"]  .li-name{color:var(--wine);}
.legend-item[data-type="flower"] .li-name{color:var(--olive);}
.legend-item[data-type="leaf"]   .li-name{color:var(--olive-light);}
.legend-item[data-type="root"]   .li-name{color:var(--ink3);}
.li-desc{font-size:10px;font-weight:300;color:var(--ink3);margin-top:3px;}

/* ── Footer ── */
footer{margin-top:36px;padding-top:12px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end;animation:fi .6s .7s ease both;opacity:0;}
.footer-left{font-size:9px;font-weight:400;color:var(--ink3);letter-spacing:.06em;line-height:1.8;}
.footer-right{font-size:13px;font-weight:900;letter-spacing:-.02em;color:var(--ink3);}

/* ── Clock digits ── */
.digit-wrap{display:inline-block;overflow:hidden;vertical-align:top;line-height:inherit;}
.digit-inner{display:block;animation:digitUp .35s cubic-bezier(.23,1,.32,1) both;}

/* ── Keyframes ── */
@keyframes fi{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes ruleIn{to{transform:scaleX(1);}}
@keyframes digitUp{from{transform:translateY(60%);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes drawPath{to{stroke-dashoffset:0;}}
@keyframes verdictFlip{from{transform:translateY(105%);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes tasteFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes moonSpin{from{transform:rotate(-90deg) scale(.4);opacity:0;}to{transform:rotate(0deg) scale(1);opacity:1;}}
@keyframes labelSlide{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:translateX(0);}}
@keyframes wdIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.week-day{opacity:0;}

@media(max-width:380px){.outer{padding:0 12px 48px;}}

/* Desktop right-column spacing */
@media(min-width:900px){
  .col-right .result-block{margin-top:0;}
  .col-right .dial-section{margin-top:0;}
  .full-width{margin-top:28px;}
  header.full-width{margin-top:0;}
  .datetime-row{margin-top:24px;}
}
</style>
</head>
<body>
<div class="outer">
<div class="page">

  <!-- HEADER — full width -->
  <header class="full-width">
    <div class="wordmark">Vino<span>Luna</span></div>
    <div class="header-tagline">Biodynamic<br>Wine Calendar</div>
  </header>

  <!-- LEFT COL: datetime + moon + result -->
  <div class="col-left">
    <div class="datetime-row">
      <div class="time-display" id="clock-display">--:--</div>
      <div class="date-col">
        <div class="date-day" id="day-name-display">---</div>
        <div class="date-full" id="date-display">-- --- ----</div>
        <div class="location-row" id="location-display"> </div>
      </div>
    </div>

    <div class="rule-thick"></div>

    <div class="moon-strip">
      <div class="moon-label">Lunar Phase</div>
      <div class="moon-value">
        <svg class="moon-icon" id="moon-phase-svg" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
        <span id="moon-phase-text">—</span>
      </div>
    </div>

    <div class="rule"></div>

    <!-- Result card -->
    <div class="result-block fruit" id="result-card">
      <span class="result-corner" id="result-corner"></span>
      <div class="wine-fill"></div>
      <div class="result-type-row">
        <svg class="result-type-icon" id="result-icon-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="result-type-label" id="result-type-label"></div>
      </div>
      <div class="verdict-word" id="verdict-main"></div>
      <div class="verdict-sub" id="verdict-sub"></div>
      <!-- Wine bottle SVG -->
      <div class="wine-bottle-wrap" id="wine-bottle">
        <svg viewBox="0 0 44 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Bottle neck -->
          <rect x="17" y="2" width="10" height="28" rx="2" stroke="#6B1A2A" stroke-width="1.4"/>
          <!-- Foil cap -->
          <rect x="15" y="2" width="14" height="10" rx="2" stroke="#6B1A2A" stroke-width="1.4"/>
          <!-- Shoulder curve -->
          <path d="M17 30 C10 38 8 44 8 52 L8 106 C8 110 11 113 15 113 L29 113 C33 113 36 110 36 106 L36 52 C36 44 34 38 27 30Z" stroke="#6B1A2A" stroke-width="1.4" stroke-linejoin="round"/>
          <!-- Label area -->
          <rect x="11" y="58" width="22" height="30" rx="2" stroke="#6B1A2A" stroke-width="1" opacity=".5"/>
          <!-- VL text hint -->
          <text x="22" y="77" font-size="8" font-weight="700" font-family="Barlow,sans-serif" text-anchor="middle" fill="#6B1A2A" opacity=".6">VL</text>
          <!-- Base -->
          <path d="M8 106 C8 110 11 113 22 113 C33 113 36 110 36 106" stroke="#6B1A2A" stroke-width="1.4" stroke-linecap="round"/>
          <!-- Wine level fill (animated) -->
          <clipPath id="bottleClip">
            <path d="M17 30 C10 38 8 44 8 52 L8 106 C8 110 11 113 22 113 C33 113 36 110 36 106 L36 52 C36 44 34 38 27 30Z"/>
          </clipPath>
          <rect id="wine-level" x="8" y="68" width="28" height="45" fill="#6B1A2A" opacity=".15" clip-path="url(#bottleClip)"/>
        </svg>
      </div>
    </div>

    <!-- Tasting note -->
    <div class="tasting-block">
      <div class="tasting-kicker">Lunar Insight</div>
      <div class="tasting-text" id="notes-text"></div>
    </div>
  </div>

  <!-- RIGHT COL: dial + date nav + week + legend -->
  <div class="col-right">
    <div class="dial-section">
      <div class="section-label-wrap">
        <div class="section-label">Drag to explore</div>
        <div class="section-rule"></div>
      </div>
      <div class="dial-wrapper">
        <canvas id="dial-canvas" width="640" height="640"></canvas>
        <div class="dial-center-info">
          <div class="dc-day" id="dial-center-day">---</div>
          <div class="dc-time" id="dial-center-hour">--:--</div>
          <div class="dc-period" id="dial-center-period">--</div>
        </div>
      </div>

      <!-- Date navigator -->
      <div class="date-nav" id="date-nav">
        <button class="date-nav-btn" id="prev-day" aria-label="Previous day">
          <svg viewBox="0 0 12 12"><path d="M8 2L4 6L8 10"/></svg>
        </button>
        <div class="date-nav-center">
          <div class="date-nav-label">Selected Date</div>
          <div class="date-nav-date" id="date-nav-date">— — —</div>
          <div class="date-nav-today" id="date-nav-today">TODAY</div>
        </div>
        <button class="date-nav-btn" id="next-day" aria-label="Next day">
          <svg viewBox="0 0 12 12"><path d="M4 2L8 6L4 10"/></svg>
        </button>
      </div>

      <!-- Week strip -->
      <div class="week-strip" id="week-strip"></div>
    </div>

    <!-- Legend -->
    <div class="legend-grid full-width-mobile">
      <div class="legend-item" data-type="fruit">
        <svg class="li-icon" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="20" r="3.8" stroke="#6B1A2A" stroke-width="1.4"/>
          <circle cx="9.2" cy="16.5" r="3.8" stroke="#6B1A2A" stroke-width="1.4"/>
          <circle cx="18.8" cy="16.5" r="3.8" stroke="#6B1A2A" stroke-width="1.4"/>
          <circle cx="14" cy="12.5" r="3.8" stroke="#6B1A2A" stroke-width="1.4"/>
          <circle cx="9.5" cy="9" r="3.2" stroke="#6B1A2A" stroke-width="1.4"/>
          <circle cx="18.5" cy="9" r="3.2" stroke="#6B1A2A" stroke-width="1.4"/>
          <path d="M14 8.5 Q15.5 5 19.5 4" stroke="#6B1A2A" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <div><div class="li-name">Fruit</div><div class="li-desc">Best for wine tasting</div></div>
      </div>
      <div class="legend-item" data-type="flower">
        <svg class="li-icon" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="3.2" stroke="#6B6B3A" stroke-width="1.4"/>
          <ellipse cx="14" cy="7" rx="2.8" ry="4.5" stroke="#6B6B3A" stroke-width="1.4"/>
          <ellipse cx="14" cy="21" rx="2.8" ry="4.5" stroke="#6B6B3A" stroke-width="1.4"/>
          <ellipse cx="7" cy="14" rx="4.5" ry="2.8" stroke="#6B6B3A" stroke-width="1.4"/>
          <ellipse cx="21" cy="14" rx="4.5" ry="2.8" stroke="#6B6B3A" stroke-width="1.4"/>
          <ellipse cx="9.5" cy="9.5" rx="2.8" ry="4.5" stroke="#6B6B3A" stroke-width="1.4" transform="rotate(-45 9.5 9.5)"/>
          <ellipse cx="18.5" cy="18.5" rx="2.8" ry="4.5" stroke="#6B6B3A" stroke-width="1.4" transform="rotate(-45 18.5 18.5)"/>
          <ellipse cx="18.5" cy="9.5" rx="2.8" ry="4.5" stroke="#6B6B3A" stroke-width="1.4" transform="rotate(45 18.5 9.5)"/>
          <ellipse cx="9.5" cy="18.5" rx="2.8" ry="4.5" stroke="#6B6B3A" stroke-width="1.4" transform="rotate(45 9.5 18.5)"/>
        </svg>
        <div><div class="li-name">Flower</div><div class="li-desc">Light &amp; aromatic</div></div>
      </div>
      <div class="legend-item" data-type="leaf">
        <svg class="li-icon" viewBox="0 0 28 28" fill="none">

<script>
// ═══════════════════════════════════════════════════════════════
// BIODYNAMIC CALENDAR — Moon phase → day type
//
// Maria Thun's system maps moon phase (not zodiac sign alone)
// to planting/tasting quality. The primary driver used in
// practice by Thun followers for WINE tasting is:
//
//   New Moon        → Root   (earth energy, closed)
//   Waxing Crescent → Flower (ascending, light)
//   First Quarter   → Fruit  (ascending, peak energy)
//   Waxing Gibbous  → Fruit  (high energy, excellent)
//   Full Moon       → Fruit  (maximum vitality — best day)
//   Waning Gibbous  → Flower (descending but still open)
//   Last Quarter    → Leaf   (descending, watery)
//   Waning Crescent → Root   (closing, earthy, contracted)
//
// This is the phase-based interpretation used by most
// biodynamic wineries (e.g. Demeter guidelines, Thun calendar).
// ═══════════════════════════════════════════════════════════════

const PHASE_DAY_TYPE = {
  new:          'root',
  waxcrescent:  'flower',
  firstquarter: 'fruit',
  waxgibbous:   'fruit',
  full:         'fruit',
  wangibbous:   'flower',
  lastquarter:  'leaf',

};

};

// ═══════════════════════════════════════════════════════════════
// LUNAR CALCULATION
// Anchor: Jan 6 2000 18:14 UTC — verified new moon
// ═══════════════════════════════════════════════════════════════
function getLunarData(date) {
  const anchor = new Date('2000-01-06T18:14:00Z');
  const elapsed = (date - anchor) / 86400000;
  const cyclePos = ((elapsed % 29.53059) + 29.53059) % 29.53059;

  let phase, phaseKey;
  if      (cyclePos <  1.85) { phase='New Moon';        phaseKey='new'; }
  else if (cyclePos <  7.38) { phase='Waxing Crescent'; phaseKey='waxcrescent'; }
  else if (cyclePos <  9.22) { phase='First Quarter';   phaseKey='firstquarter'; }
  else if (cyclePos < 14.76) { phase='Waxing Gibbous';  phaseKey='waxgibbous'; }
  else if (cyclePos < 16.61) { phase='Full Moon';       phaseKey='full'; }
  else if (cyclePos < 22.15) { phase='Waning Gibbous';  phaseKey='wangibbous'; }
  else if (cyclePos < 23.99) { phase='Last Quarter';    phaseKey='lastquarter'; }
  else                        { phase='Waning Crescent'; phaseKey='wancrescent'; }

  const dayType = PHASE_DAY_TYPE[phaseKey];
  return { phase, phaseKey, dayType, cyclePos };
}

// ═══════════════════════════════════════════════════════════════
// DIAL CANVAS
// ═══════════════════════════════════════════════════════════════
let breathT=0;
const DC=document.getElementById('dial-canvas');
const dctx=DC.getContext('2d');
const SZ=640,CX=320,CY=320,RO=295,RI=210,RT=268;

function drawDial(date) {
  dctx.clearRect(0,0,SZ,SZ);
  const lunar=getLunarData(date);
  const hf=date.getHours()+date.getMinutes()/60;
  const ha=(hf/24)*Math.PI*2-Math.PI/2;
  const isGood=lunar.dayType==='fruit'||lunar.dayType==='flower';
  const pulse=0.5+0.5*Math.sin(breathT);
  const curSeg=Math.floor(hf)%24;

  // Hour segments
  for(let seg=0;seg<24;seg++){
    const a0=(seg/24)*Math.PI*2-Math.PI/2, a1=((seg+0.88)/24)*Math.PI*2-Math.PI/2;
    const night=seg<6||seg>=22;
    const isActive=seg===curSeg;
    let alpha=isActive?(isGood?0.28+0.14*pulse:0.2+0.1*pulse):(night?(isGood?0.07:0.05):(isGood?0.14:0.1));
    dctx.beginPath();
    dctx.arc(CX,CY,RO-1,a0,a1);
    dctx.arc(CX,CY,RI+1,a1,a0,true);
    dctx.closePath();
    dctx.fillStyle=isGood?`rgba(107,26,42,${alpha})`:`rgba(107,107,58,${alpha})`;
    dctx.fill();
  }

  // Outer ring
  dctx.beginPath();dctx.arc(CX,CY,RO,0,Math.PI*2);
  dctx.strokeStyle='#C8C8C8';dctx.lineWidth=1;dctx.stroke();

  // Ticks + labels
  for(let i=0;i<24;i++){
    const a=(i/24)*Math.PI*2-Math.PI/2;
    const major=i%6===0,mid=i%3===0;
    const r2=major?RO-22:mid?RO-12:RO-7;
    const p1={x:CX+RO*Math.cos(a),y:CY+RO*Math.sin(a)};
    const p2={x:CX+r2*Math.cos(a),y:CY+r2*Math.sin(a)};
    dctx.beginPath();dctx.moveTo(p1.x,p1.y);dctx.lineTo(p2.x,p2.y);
    dctx.strokeStyle=major?'#2A2A2A':'#C0C0C0';
    dctx.lineWidth=major?2:0.8;dctx.stroke();
    if(major){
      const lr=RO-38,lx=CX+lr*Math.cos(a),ly=CY+lr*Math.sin(a);
      dctx.fillStyle='#2A2A2A';
      dctx.font='600 20px Barlow,Helvetica Neue,sans-serif';
      dctx.textAlign='center';dctx.textBaseline='middle';
      dctx.fillText(i===0?'12A':i===6?'6A':i===12?'12P':'6P',lx,ly);
    }
  }

  // Inner ring
  dctx.beginPath();dctx.arc(CX,CY,RI,0,Math.PI*2);
  dctx.strokeStyle='#C8C8C8';dctx.lineWidth=1;dctx.stroke();

  // Day arcs — show 7 days centered on current
  const DRO=RI-1,DRI=RI-34;
  const DSHORT=['S','M','T','W','T','F','S'];
  const ws=new Date(date);ws.setDate(ws.getDate()-ws.getDay()); // Sunday start
  for(let d=0;d<7;d++){
    const dd=new Date(ws);dd.setDate(ws.getDate()+d);
    const dl=getLunarData(dd);
    const a0=(d/7)*Math.PI*2-Math.PI/2,a1=((d+0.88)/7)*Math.PI*2-Math.PI/2;
    const midA=((d+0.44)/7)*Math.PI*2-Math.PI/2;
    const today=dd.toDateString()===date.toDateString();
    const dg=dl.dayType==='fruit'||dl.dayType==='flower';
    dctx.beginPath();
    dctx.arc(CX,CY,DRO,a0,a1);dctx.arc(CX,CY,DRI,a1,a0,true);dctx.closePath();
    dctx.fillStyle=today?(dg?'#6B1A2A':'#6B6B3A'):(dg?'rgba(107,26,42,.12)':'rgba(107,107,58,.08)');
    dctx.fill();
    if(today){dctx.strokeStyle=dg?'#6B1A2A':'#6B6B3A';dctx.lineWidth=1.5;dctx.stroke();}
    const lr=(DRO+DRI)/2,lx=CX+lr*Math.cos(midA),ly=CY+lr*Math.sin(midA);
    dctx.fillStyle=today?'#F2EBD9':'#9A9A9A';
    dctx.font=`${today?'700':'300'} 18px Barlow,Helvetica Neue,sans-serif`;
    dctx.textAlign='center';dctx.textBaseline='middle';
    dctx.fillText(DSHORT[dd.getDay()],lx,ly);
  }

  // Dashed line
  const hpt={x:CX+RT*Math.cos(ha),y:CY+RT*Math.sin(ha)};
  dctx.beginPath();dctx.moveTo(CX,CY);dctx.lineTo(hpt.x,hpt.y);
  dctx.strokeStyle='rgba(42,42,42,.18)';dctx.lineWidth=1;
  dctx.setLineDash([3,5]);dctx.stroke();dctx.setLineDash([]);

  // Hand dot
  dctx.beginPath();dctx.arc(hpt.x,hpt.y,17,0,Math.PI*2);
  dctx.fillStyle='#6B1A2A';dctx.fill();
  dctx.strokeStyle='#EBEBEB';dctx.lineWidth=1.5;
  dctx.beginPath();dctx.moveTo(hpt.x-7,hpt.y);dctx.lineTo(hpt.x+7,hpt.y);dctx.stroke();
  dctx.beginPath();dctx.moveTo(hpt.x,hpt.y-7);dctx.lineTo(hpt.x,hpt.y+7);dctx.stroke();

  // Center void
  dctx.beginPath();dctx.arc(CX,CY,DRI-3,0,Math.PI*2);
  dctx.fillStyle='#EBEBEB';dctx.fill();
  dctx.strokeStyle='#D0D0D0';dctx.lineWidth=1;dctx.stroke();
}

let state={now:new Date(), dialDate:new Date()};

function renderClock(date) {
  const hh=String(date.getHours()).padStart(2,'0');
  const mm=String(date.getMinutes()).padStart(2,'0');
  const str=`${hh}:${mm}`;
  const el=document.getElementById('clock-display');
  if(str===prevClockStr&&el.children.length>0) return;
  prevClockStr=str;
  el.innerHTML='';
  [...str].forEach((ch,i)=>{
    if(ch===':'){const sep=document.createElement('span');sep.textContent=':';sep.style.display='inline-block';el.appendChild(sep);}
    else{const wrap=document.createElement('span');wrap.className='digit-wrap';const inner=document.createElement('span');inner.className='digit-inner';inner.textContent=ch;inner.style.animationDelay=`${i*30}ms`;wrap.appendChild(inner);el.appendChild(wrap);}
  });
}

function animateVerdict(el,text) {
  el.innerHTML='';const span=document.createElement('span');span.className='vflip';span.textContent=text;el.appendChild(span);
}
function animateIcon(svgEl,html) {
  svgEl.innerHTML=html;svgEl.classList.remove('draw');void svgEl.offsetWidth;svgEl.classList.add('draw');

function animateMoon(svgEl,phaseKey) {

}
function flashCard(card) {

function animateBottle() {

function updateDateNav(date) {

// ═══════════════════════════════════════════════════════════════
// WEEK STRIP
// ═══════════════════════════════════════════════════════════════
function buildWeekStrip(current) {
  const strip=document.getElementById('week-strip');strip.innerHTML='';
  const ws=new Date(current);ws.setDate(ws.getDate()-ws.getDay());
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(ws.getDate()+i);
    const lun=getLunarData(d);
    const today=d.toDateString()===current.toDateString();
    const div=document.createElement('div');
    div.className=`week-day${today?' active':''}`;
    div.style.animation=`wdIn 0.35s ${i*45}ms cubic-bezier(.23,1,.32,1) both`;
    div.innerHTML=`<div class="wd-name">${DAYS_SHORT[d.getDay()].slice(0,2)}</div><div class="wd-num">${d.getDate()}</div><svg class="wd-icon-wrap" viewBox="0 0 18 18" fill="none">${smallIconSVG(lun.dayType)}</svg>`;
    div.addEventListener('click',()=>{
      const nd=new Date(state.dialDate);nd.setFullYear(d.getFullYear(),d.getMonth(),d.getDate());
      state.dialDate=nd;updateUI(state.dialDate);
    });
    strip.appendChild(div);
  }
}

// ═══════════════════════════════════════════════════════════════
// MAIN UI UPDATE
// ═══════════════════════════════════════════════════════════════
function updateUI(date) {
  const lunar=getLunarData(date);
  const cfg=DAY_CONFIG[lunar.dayType];
  const n=state.now;
  const typeChanged=lunar.dayType!==lastType;
  const phaseChanged=lunar.phaseKey!==lastPhaseKey;
  const isGood=lunar.dayType==='fruit'||lunar.dayType==='flower';

  renderClock(n);
  document.getElementById('day-name-display').textContent=DAYS_FULL[n.getDay()].toUpperCase();
  document.getElementById('date-display').textContent=`${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;

  if(phaseChanged){
    animateMoon(document.getElementById('moon-phase-svg'),lunar.phaseKey);
    document.getElementById('moon-phase-text').textContent=lunar.phase;
    lastPhaseKey=lunar.phaseKey;
  }

  const card=document.getElementById('result-card');
  card.className=`result-block ${lunar.dayType}`;

  if(typeChanged){
    flashCard(card);
    animateIcon(document.getElementById('result-icon-svg'),dayIconSVG(lunar.dayType));
    animateLabel(document.getElementById('result-type-label'),cfg.label);
    document.getElementById('result-corner').textContent=cfg.corner;
    const vEl=document.getElementById('verdict-main');
    vEl.className=`verdict-word${isGood?'':' avoid'}`;
    animateVerdict(vEl,cfg.verdict);
    const subEl=document.getElementById('verdict-sub');
    subEl.classList.add('hide');
    setTimeout(()=>{subEl.textContent=cfg.sub;subEl.classList.remove('hide');},200);
    animateTasting(document.getElementById('notes-text'),NOTES[lunar.dayType][Math.floor(date.getTime()/86400000)%3]);
    animateBottle();
    lastType=lunar.dayType;
  } else {
    document.getElementById('result-icon-svg').innerHTML=dayIconSVG(lunar.dayType);
    document.getElementById('result-type-label').textContent=cfg.label;
    document.getElementById('result-corner').textContent=cfg.corner;
    const vEl=document.getElementById('verdict-main');
    vEl.textContent=cfg.verdict;vEl.className=`verdict-word${isGood?'':' avoid'}`;
    document.getElementById('verdict-sub').textContent=cfg.sub;
    document.getElementById('notes-text').textContent=NOTES[lunar.dayType][Math.floor(date.getTime()/86400000)%3];
  }

  const dh=date.getHours(),dm=date.getMinutes(),h12=dh%12||12;
  document.getElementById('dial-center-day').textContent=DAYS_SHORT[date.getDay()];
  document.getElementById('dial-center-hour').textContent=`${h12}:${String(dm).padStart(2,'0')}`;
  document.getElementById('dial-center-period').textContent=dh<12?'AM':'PM';

  updateDateNav(date);
  drawDial(date);
  buildWeekStrip(date);
}

// ═══════════════════════════════════════════════════════════════
// DRAG — rolls through days when completing full rotations
// ═══════════════════════════════════════════════════════════════
function getAngle(e,rect) {
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  return Math.atan2(cy-rect.top-rect.height/2, cx-rect.left-rect.width/2);
}
function inRing(e,rect) {
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  const dx=cx-rect.left-rect.width/2, dy=cy-rect.top-rect.height/2;
  const dist=Math.sqrt(dx*dx+dy*dy)/(rect.width/SZ);
  return dist>(RI-38)&&dist<(RO+12);
}

DC.addEventListener('mousedown',e=>{
  if(inRing(e,DC.getBoundingClientRect())){
    dragging=true;
    dragLastAngle=getAngle(e,DC.getBoundingClientRect());
    dragAccumAngle=0;
    dragStartDate=new Date(state.dialDate);
    document.addEventListener('mousemove',onDrag);
    document.addEventListener('mouseup',endDrag);
  }
});
DC.addEventListener('touchstart',e=>{
  if(inRing(e,DC.getBoundingClientRect())){
    dragging=true;
    dragLastAngle=getAngle(e,DC.getBoundingClientRect());
    dragAccumAngle=0;
    dragStartDate=new Date(state.dialDate);
    document.addEventListener('touchmove',onDrag,{passive:false});
    document.addEventListener('touchend',endDrag);
  }
},{passive:true});

function onDrag(e) {
  if(!dragging) return;
  if(e.preventDefault) e.preventDefault();
  const rect=DC.getBoundingClientRect();
  const angle=getAngle(e,rect);

  // Compute delta, handle wraparound at ±π
  let delta=angle-dragLastAngle;
  if(delta>Math.PI)  delta-=Math.PI*2;
  if(delta<-Math.PI) delta+=Math.PI*2;
  dragLastAngle=angle;

  // Accumulate total rotation. Full circle (2π) = 24 hours
  dragAccumAngle+=delta;

  // Convert accumulated angle to minutes from drag start
  const totalMinutes=(dragAccumAngle/(Math.PI*2))*24*60;
  const nd=new Date(dragStartDate);
  nd.setMinutes(nd.getMinutes()+Math.round(totalMinutes));
  // Zero out seconds
  nd.setSeconds(0,0);
  state.dialDate=nd;
  updateUI(state.dialDate);
}

function endDrag() {
  dragging=false;
  document.removeEventListener('mousemove',onDrag);
  document.removeEventListener('touchmove',onDrag);
  document.removeEventListener('mouseup',endDrag);
  document.removeEventListener('touchend',endDrag);
}

// ═══════════════════════════════════════════════════════════════
// GEOLOCATION
// ═══════════════════════════════════════════════════════════════
navigator.geolocation&&navigator.geolocation.getCurrentPosition(
  p=>fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.coords.latitude}&lon=${p.coords.longitude}&format=json`)
    .then(r=>r.json())
    .then(d=>{
      const c=d.address.city||d.address.town||d.address.village||'';
      const cc=d.address.country_code?d.address.country_code.toUpperCase():'';
      document.getElementById('location-display').textContent=c?`${c}, ${cc}`:cc;
    }).catch(()=>{}),
  ()=>{},{timeout:8000}
);

// ═══════════════════════════════════════════════════════════════
// BREATH LOOP (canvas pulse)
// ═══════════════════════════════════════════════════════════════
function breathLoop() {
  breathT+=0.012;
  if(!dragging&&Math.round(breathT*100)%4===0) drawDial(state.dialDate);
  requestAnimationFrame(breathLoop);
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
state.now=new Date();
state.dialDate=new Date(state.now);
lastType=null;lastPhaseKey=null;
updateUI(state.dialDate);
setTimeout(()=>{
  animateIcon(document.getElementById('result-icon-svg'),document.getElementById('result-icon-svg').innerHTML);
  animateMoon(document.getElementById('moon-phase-svg'),getLunarData(state.dialDate).phaseKey);
  const vEl=document.getElementById('verdict-main');
  animateVerdict(vEl,vEl.textContent||DAY_CONFIG[getLunarData(state.dialDate).dayType].verdict);
},400);
setInterval(()=>{state.now=new Date();renderClock(state.now);},30000);
requestAnimationFrame(breathLoop);
</script>
