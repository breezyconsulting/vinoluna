<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VinoLuna</title>
<meta name="description" content="Is today a good day for wine? The biodynamic lunar calendar for wine lovers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,700;0,900;1,300&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --ink: #2A2A2A; --ink2: #5A5A5A; --ink3: #9A9A9A;
  --paper: #EBEBEB; --white: #F5F5F3; --rule: #D0D0D0;
  --cream: #F2EBD9;
  --olive: #6B6B3A;
  --olive-light: #8E8E50;
  --wine: #6B1A2A;
  --wine-mid: #8C2438;
  --wine-pale: #D4A0A8;
}
html, body { background: var(--paper); }
body {
  color: var(--ink);
  font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 480px; margin: 0 auto; padding: 0 24px 64px; }

header {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 28px 0 10px; border-bottom: 2px solid var(--ink);
  animation: fi 0.6s ease both;
}
.wordmark { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.wordmark span { font-weight: 300; }
.header-tagline { font-size: 9px; font-weight: 400; letter-spacing: 0.18em; color: var(--ink3); text-transform: uppercase; line-height: 1.5; text-align: right; }

.datetime-row {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-top: 32px; animation: fi 0.6s 0.1s ease both; opacity: 0;
}
.time-display { font-size: clamp(56px,16vw,80px); font-weight: 900; letter-spacing: -0.04em; line-height: 0.88; }
.date-col { text-align: right; padding-bottom: 6px; }
.date-day { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
.date-full { font-size: 11px; font-weight: 300; color: var(--ink2); margin-top: 2px; }
.location-row { font-size: 10px; font-weight: 400; color: var(--ink3); letter-spacing: 0.06em; margin-top: 3px; }

.rule { height: 1px; background: var(--rule); margin: 16px 0; }
.rule-thick { height: 2px; background: var(--ink); margin: 16px 0; }

.moon-strip {
  display: flex; justify-content: space-between; align-items: center; padding: 8px 0;
  animation: fi 0.6s 0.2s ease both; opacity: 0;
}
.moon-label { font-size: 10px; font-weight: 400; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); }
.moon-value { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center; gap: 7px; color: var(--wine); }
.moon-icon { width: 16px; height: 16px; }

.result-block {
  margin-top: 24px; border: 2px solid var(--ink); padding: 28px 24px 24px;
  position: relative; animation: fi 0.6s 0.25s ease both; opacity: 0;
  transition: border-color 0.4s, background 0.4s;
}
.result-block.fruit  { background: var(--cream); border-color: var(--wine); }
.result-block.flower { background: var(--cream); border-color: var(--olive); }
.result-block.leaf   { background: var(--paper); border-color: var(--olive-light); }
.result-block.root   { background: var(--paper); border-color: var(--ink3); }
.result-corner { position: absolute; top: 10px; right: 14px; font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink3); }
.result-type-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.result-type-icon { width: 64px; height: 64px; flex-shrink: 0; }
.result-type-label { font-size: clamp(22px, 7vw, 30px); font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase; line-height: 1; transition: color 0.4s; }
.result-block.fruit  .result-type-label { color: var(--wine); }
.result-block.flower .result-type-label { color: var(--olive); }
.result-block.leaf   .result-type-label { color: var(--olive-light); }
.result-block.root   .result-type-label { color: var(--ink3); }
.verdict-word { font-size: clamp(72px,22vw,100px); font-weight: 900; letter-spacing: -0.04em; line-height: 0.85; transition: color 0.4s; }
.result-block.fruit  .verdict-word,
.result-block.flower .verdict-word { color: var(--ink); }
.verdict-word.avoid { color: var(--ink3); }
.verdict-sub { font-size: 12px; font-weight: 300; font-style: italic; color: var(--ink2); margin-top: 10px; letter-spacing: 0.04em; }

.dial-section { margin-top: 28px; animation: fi 0.6s 0.35s ease both; opacity: 0; }
.section-label { font-size: 9px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink3); margin-bottom: 12px; }

.dial-wrapper { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto; }
#dial-canvas { width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#dial-canvas:active { cursor: grabbing; }

.dial-center-info {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; pointer-events: none;
}
.dc-day { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; color: var(--ink3); text-transform: uppercase; }
.dc-time { font-size: clamp(22px,7vw,30px); font-weight: 900; letter-spacing: -0.03em; color: var(--ink); line-height: 1.1; }
.dc-period { font-size: 9px; font-weight: 400; letter-spacing: 0.18em; color: var(--ink3); text-transform: uppercase; }

.week-strip { display: flex; gap: 4px; margin-top: 16px; }
.week-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px; cursor: pointer; border: 1px solid transparent; transition: border-color 0.2s, background 0.2s; }
.week-day:hover { background: rgba(42,42,42,0.05); }
.week-day.active { border-color: var(--ink); }
.wd-name { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--ink3); text-transform: uppercase; }
.week-day.active .wd-name { color: var(--ink); }
.wd-num { font-size: 15px; font-weight: 900; color: var(--ink); letter-spacing: -0.02em; line-height: 1; }
.wd-icon-wrap { width: 18px; height: 18px; }

.legend-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  margin-top: 28px; border: 1px solid var(--rule);
  animation: fi 0.6s 0.45s ease both; opacity: 0;
}
.legend-item {
  display: flex; align-items: flex-start; gap: 12px; padding: 16px 14px;
  border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  cursor: pointer; transition: background 0.15s;
}
.legend-item:nth-child(2n) { border-right: none; }
.legend-item:nth-child(3), .legend-item:nth-child(4) { border-bottom: none; }
.legend-item[data-type="fruit"]  { background: var(--cream); }
.legend-item[data-type="flower"] { background: var(--cream); }
.legend-item:hover { filter: brightness(0.96); }
.li-icon { width: 40px; height: 40px; flex-shrink: 0; margin-top: 2px; }
.li-name { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
.legend-item[data-type="fruit"]  .li-name { color: var(--wine); }
.legend-item[data-type="flower"] .li-name { color: var(--olive); }
.legend-item[data-type="leaf"]   .li-name { color: var(--olive-light); }
.legend-item[data-type="root"]   .li-name { color: var(--ink3); }
.li-desc { font-size: 10px; font-weight: 300; color: var(--ink3); margin-top: 3px; }

.tasting-block {
  padding: 16px 0; border-bottom: 1px solid var(--rule);
  animation: fi 0.6s 0.5s ease both; opacity: 0;
}
.tasting-kicker { font-size: 9px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink3); margin-bottom: 6px; }
.tasting-text { font-size: 13px; font-weight: 300; font-style: italic; color: var(--ink2); line-height: 1.65; }

footer {
  margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--rule);
  display: flex; justify-content: space-between; align-items: flex-end;
  animation: fi 0.6s 0.6s ease both; opacity: 0;
}
.footer-left { font-size: 9px; font-weight: 400; color: var(--ink3); letter-spacing: 0.06em; line-height: 1.8; }
.footer-right { font-size: 13px; font-weight: 900; letter-spacing: -0.02em; color: var(--ink3); }

@keyframes fi { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── Rule draw-in ── */
.rule-thick {
  height: 2px; background: transparent; margin: 16px 0;
  position: relative; overflow: hidden;
}
.rule-thick::after {
  content: ''; position: absolute; inset: 0;
  background: var(--ink);
  transform: scaleX(0); transform-origin: left;
  animation: ruleIn 0.8s 0.3s cubic-bezier(0.77,0,0.18,1) forwards;
}
@keyframes ruleIn { to { transform: scaleX(1); } }

/* ── Clock digit flip ── */
.digit-wrap { display: inline-block; overflow: hidden; vertical-align: top; line-height: inherit; }
.digit-inner { display: block; animation: digitUp 0.35s cubic-bezier(0.23,1,0.32,1) both; }
@keyframes digitUp {
  from { transform: translateY(60%); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}

/* ── Result card border flash ── */
.result-block { transition: border-color 0.5s, background 0.5s; }
@keyframes borderPulse {
  0%   { outline: 3px solid transparent; outline-offset: 0; }
  40%  { outline: 3px solid var(--wine); outline-offset: 3px; }
  100% { outline: 3px solid transparent; outline-offset: 6px; }
}
.result-block.flash { animation: borderPulse 0.6s ease; }

/* ── Icon draw-in (SVG stroke animation) ── */
.result-type-icon.draw path,
.result-type-icon.draw circle,
.result-type-icon.draw ellipse {
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
  animation: drawPath 0.8s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes drawPath { to { stroke-dashoffset: 0; } }

/* ── Verdict flip ── */
.verdict-word { overflow: hidden; }
.verdict-word .vflip {
  display: block;
  animation: verdictFlip 0.45s cubic-bezier(0.23,1,0.32,1) both;
}
@keyframes verdictFlip {
  from { transform: translateY(105%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

/* ── Tasting text fade up ── */
.tasting-text.fade-in { animation: tasteFade 0.5s ease both; }
@keyframes tasteFade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Moon spin-in ── */
.moon-icon.spin-in { animation: moonSpin 0.55s cubic-bezier(0.34,1.4,0.64,1) both; }
@keyframes moonSpin {
  from { transform: rotate(-90deg) scale(0.4); opacity: 0; }
  to   { transform: rotate(0deg)   scale(1);   opacity: 1; }
}

/* ── Day type label slide ── */
.result-type-label.slide-in { animation: labelSlide 0.4s cubic-bezier(0.23,1,0.32,1) both; }
@keyframes labelSlide {
  from { opacity: 0; transform: translateX(-12px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ── Week day stagger ── */
.week-day { opacity: 0; }

/* ── Dial ring breath ── */
.dial-wrapper::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  pointer-events: none;
  animation: dialBreath 4s ease-in-out infinite;
}
@keyframes dialBreath {
  0%, 100% { box-shadow: inset 0 0 0 1px rgba(107,26,42,0.08); }
  50%       { box-shadow: inset 0 0 0 2px rgba(107,26,42,0.22); }
}

/* ── Legend hover lift ── */
.legend-item { transition: background 0.15s, transform 0.25s cubic-bezier(0.23,1,0.32,1), box-shadow 0.25s; }
.legend-item:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); filter: none; }

/* ── Wordmark hover ── */
.wordmark { transition: letter-spacing 0.4s cubic-bezier(0.23,1,0.32,1); cursor: default; }
.wordmark:hover { letter-spacing: 0.06em; }

/* ── Section label rule ── */
.section-label-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.section-label-wrap .section-label { margin-bottom: 0; }
.section-rule { flex: 1; height: 1px; background: var(--rule); transform: scaleX(0); transform-origin: left; animation: ruleIn 0.7s 1.1s ease forwards; }

/* ── Verdict sub fade ── */
.verdict-sub { transition: opacity 0.25s, transform 0.25s; }
.verdict-sub.hide { opacity: 0; transform: translateY(4px); }

@media (max-width: 380px) { .page { padding: 0 16px 48px; } }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="wordmark">Vino<span>Luna</span></div>

<script>
const ZODIAC_TYPES = {aries:'fruit',leo:'fruit',sagittarius:'fruit',taurus:'root',virgo:'root',capricorn:'root',gemini:'flower',libra:'flower',aquarius:'flower',cancer:'leaf',scorpio:'leaf',pisces:'leaf'};
const DAY_CONFIG = {
  fruit:  {label:'Fruit Day',  verdict:'YES',  verdictClass:'',      sub:'Exceptional for wine tasting',  corner:'FIRE SIGN'},
  flower: {label:'Flower Day', verdict:'YES',  verdictClass:'',      sub:'Good — light wines especially', corner:'AIR SIGN'},
  leaf:   {label:'Leaf Day',   verdict:'AVOID',verdictClass:'avoid', sub:'Wines taste muted and flat',    corner:'WATER SIGN'},
  root:   {label:'Root Day',   verdict:'AVOID',verdictClass:'avoid', sub:'Poor day for wine appreciation',corner:'EARTH SIGN'},
};
const NOTES = {
  fruit: ["Fruit days reveal wine at its most expressive. Aromatics bloom, finishes lengthen, complexity deepens. The fire-sign moon draws out everything a wine was made to be.","Under a fire-sign moon, wines open completely. Tannins soften, fruit surges forward. An ideal moment for that special bottle you've been saving.","Lunar fire ignites the glass. Complex wines reveal hidden layers, simple wines punch above their weight. A perfect evening for tasting and celebrating."],
  flower: ["Flower days carry a delicate, perfumed quality. White wines become ethereal; rosés transcend themselves. The air-sign moon lends lightness and aromatic lift to every pour.","An air-sign moon elevates subtle nuances. Minerality shines, acidity sings, florals dance. Ideal for champagne or crisp whites.","The moon breathes lightness into the glass today. Expect elegance over power, finesse over body. A day for Riesling, Grüner, or fine Chablis."],
  leaf: ["Leaf days are the moon's quiet, introverted days. Wines lean vegetal and closed — their better qualities suppressed by water-sign gravity. Save the good bottles for tomorrow.","A water-sign moon draws wines inward. They close up, withhold their charms. Your finest selections deserve a better moment.","The moon's watery influence subdues vibrancy today. Aromatics feel muted, finishes shorter. Wait for the fruit day ahead."],
  root: ["Root days bring the heaviest gravitational influence. Even great vintages seem ordinary — tight, earthy, reluctant to open. Abstain if you're a purist.","An earth-sign moon pulls wine deep. Expect muted aromas, astringent tannins, a flat finish. Better to rest the cellar.","The earth reclaims her wines today. Bottles seem closed even when they aren't. A winemaker would leave them in peace — and so should you."],
};

function getLunarData(date) {
  const anchor = new Date('2000-01-06T18:14:00Z');
  const elapsed = (date - anchor) / 86400000;
  const cyclePos = ((elapsed % 29.53059) + 29.53059) % 29.53059;
  let phase, phaseKey;
  if (cyclePos < 1.85)       {phase='New Moon';        phaseKey='new';}
  else if (cyclePos < 7.38)  {phase='Waxing Crescent'; phaseKey='waxcrescent';}
  else if (cyclePos < 9.22)  {phase='First Quarter';   phaseKey='firstquarter';}
  else if (cyclePos < 14.76) {phase='Waxing Gibbous';  phaseKey='waxgibbous';}
  else if (cyclePos < 16.61) {phase='Full Moon';       phaseKey='full';}
  else if (cyclePos < 22.15) {phase='Waning Gibbous';  phaseKey='wangibbous';}
  else if (cyclePos < 23.99) {phase='Last Quarter';    phaseKey='lastquarter';}
  else                        {phase='Waning Crescent'; phaseKey='wancrescent';}
  const moonLon = ((elapsed * 360 / 27.32166) % 360 + 360) % 360;
  const signs = ['aries','taurus','gemini','cancer','leo','virgo','libra','scorpio','sagittarius','capricorn','aquarius','pisces'];
  const moonSign = signs[Math.floor(moonLon / 30)];
  return {phase, phaseKey, moonSign, dayType: ZODIAC_TYPES[moonSign]};
}

// ── Dial canvas ──
let breathT = 0; // shared breath timer for dial pulse
const DC = document.getElementById('dial-canvas');
const dctx = DC.getContext('2d');
const SZ=640, CX=320, CY=320, RO=295, RI=210, RT=268;

function drawDial(date) {
  dctx.clearRect(0,0,SZ,SZ);
  const lunar = getLunarData(date);
  const hf = date.getHours() + date.getMinutes()/60;
  const ha = (hf/24)*Math.PI*2 - Math.PI/2;
  const isGood = lunar.dayType==='fruit'||lunar.dayType==='flower';
  const pulse = typeof breathT!=='undefined' ? 0.5+0.5*Math.sin(breathT) : 0.5;
  const curSeg = Math.floor(hf) % 24; // active hour segment

  // Hour segments
  for (let seg=0; seg<24; seg++) {
    const a0=(seg/24)*Math.PI*2-Math.PI/2, a1=((seg+0.88)/24)*Math.PI*2-Math.PI/2;
    const night = seg<6||seg>=22;
    const isActive = seg===curSeg;
    let alpha;
    if(isActive) {
      alpha = isGood ? (0.28+0.14*pulse) : (0.22+0.1*pulse);
    } else {
      alpha = isGood ? (night?0.08:0.15) : (night?0.06:0.11);
    }
    dctx.beginPath();
    dctx.arc(CX,CY,RO-1,a0,a1);
    dctx.arc(CX,CY,RI+1,a1,a0,true);
    dctx.closePath();
    dctx.fillStyle = isGood
      ? `rgba(107,26,42,${alpha})`
      : `rgba(107,107,58,${alpha})`;
    dctx.fill();
  }

  // Outer ring
  dctx.beginPath(); dctx.arc(CX,CY,RO,0,Math.PI*2);
  dctx.strokeStyle='#C8C8C8'; dctx.lineWidth=1; dctx.stroke();

  // Tick marks + labels
  for (let i=0;i<24;i++) {
    const a=(i/24)*Math.PI*2-Math.PI/2;
    const major=i%6===0, mid=i%3===0;
    const r2=major?RO-22:mid?RO-12:RO-7;
    const p1={x:CX+RO*Math.cos(a),y:CY+RO*Math.sin(a)};
    const p2={x:CX+r2*Math.cos(a),y:CY+r2*Math.sin(a)};
    dctx.beginPath(); dctx.moveTo(p1.x,p1.y); dctx.lineTo(p2.x,p2.y);
    dctx.strokeStyle=major?'#2A2A2A':'#C0C0C0';
    dctx.lineWidth=major?2:0.8; dctx.stroke();
    if (major) {
      const lr=RO-38, lx=CX+lr*Math.cos(a), ly=CY+lr*Math.sin(a);
      dctx.fillStyle='#2A2A2A';
      dctx.font='600 20px Barlow,Helvetica Neue,sans-serif';
      dctx.textAlign='center'; dctx.textBaseline='middle';
      dctx.fillText(i===0?'12A':i===6?'6A':i===12?'12P':'6P', lx, ly);
    }
  }

  // Inner ring
  dctx.beginPath(); dctx.arc(CX,CY,RI,0,Math.PI*2);
  dctx.strokeStyle='#C8C8C8'; dctx.lineWidth=1; dctx.stroke();

  // Day arcs
  const ws=new Date(date); ws.setDate(ws.getDate()-ws.getDay());
  const DRO=RI-1, DRI=RI-34;
  const DSHORT=['S','M','T','W','T','F','S'];
  for (let d=0;d<7;d++) {
    const dd=new Date(ws); dd.setDate(ws.getDate()+d);
    const dl=getLunarData(dd);
    const a0=(d/7)*Math.PI*2-Math.PI/2, a1=((d+0.88)/7)*Math.PI*2-Math.PI/2;
    const midA=((d+0.44)/7)*Math.PI*2-Math.PI/2;
    const today=dd.toDateString()===date.toDateString();
    const dg=dl.dayType==='fruit'||dl.dayType==='flower';
    dctx.beginPath();
    dctx.arc(CX,CY,DRO,a0,a1); dctx.arc(CX,CY,DRI,a1,a0,true); dctx.closePath();
    dctx.fillStyle=today
      ? (dg ? '#6B1A2A' : '#6B6B3A')
      : (dg ? 'rgba(107,26,42,0.12)' : 'rgba(107,107,58,0.08)');
    dctx.fill();
    if (today) { dctx.strokeStyle=dg?'#6B1A2A':'#6B6B3A'; dctx.lineWidth=1.5; dctx.stroke(); }
    const lr=(DRO+DRI)/2;
    const lx=CX+lr*Math.cos(midA), ly=CY+lr*Math.sin(midA);
    dctx.fillStyle=today?'#F2EBD9':'#9A9A9A';
    dctx.font=`${today?'700':'300'} 18px Barlow,Helvetica Neue,sans-serif`;
    dctx.textAlign='center'; dctx.textBaseline='middle';
    dctx.fillText(DSHORT[dd.getDay()], lx, ly);
  }

  // Dashed hand line
  const hpt={x:CX+RT*Math.cos(ha),y:CY+RT*Math.sin(ha)};
  dctx.beginPath(); dctx.moveTo(CX,CY); dctx.lineTo(hpt.x,hpt.y);
  dctx.strokeStyle='rgba(42,42,42,0.18)'; dctx.lineWidth=1;
  dctx.setLineDash([3,5]); dctx.stroke(); dctx.setLineDash([]);

  // Hand dot — wine coloured
  dctx.beginPath(); dctx.arc(hpt.x,hpt.y,17,0,Math.PI*2);
  dctx.fillStyle='#6B1A2A'; dctx.fill();
  // Crosshair inside
  dctx.strokeStyle='#EBEBEB'; dctx.lineWidth=1.5;
  dctx.beginPath(); dctx.moveTo(hpt.x-7,hpt.y); dctx.lineTo(hpt.x+7,hpt.y); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(hpt.x,hpt.y-7); dctx.lineTo(hpt.x,hpt.y+7); dctx.stroke();

  // Center circle (clear background)
  dctx.beginPath(); dctx.arc(CX,CY,DRI-3,0,Math.PI*2);
  dctx.fillStyle='#EBEBEB'; dctx.fill();
  dctx.strokeStyle='#D0D0D0'; dctx.lineWidth=1; dctx.stroke();
}

// ── DOM & State ──
const DAYS_SHORT=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const DAYS_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let state={now:new Date(), dialDate:new Date()};
let lastType=null, lastPhaseKey=null;

// ── Dial inertia ──
let targetHours=null, currentHours=null, dialRAF=null;
function lerp(a,b,t){return a+(b-a)*t;}
function angleDiff(a,b){ // shortest path on circle
  let d=((b-a)%24+24)%24; return d>12?d-24:d;
}
function startDialInertia(target) {
  if(currentHours===null) currentHours=target;
  targetHours=target;
  if(dialRAF) return;
  function step(){
    const diff=angleDiff(currentHours,targetHours);
    if(Math.abs(diff)<0.01){ currentHours=targetHours; dialRAF=null; return; }
    currentHours+=diff*0.18;
    const nd=new Date(state.dialDate);
    nd.setHours(Math.floor(currentHours),Math.floor((currentHours%1)*60),0,0);
    // Update center display only (fast path — skip full UI rebuild during inertia)
    const dh=nd.getHours(),dm=nd.getMinutes(),h12=dh%12||12;
    document.getElementById('dial-center-day').textContent=DAYS_SHORT[nd.getDay()];
    document.getElementById('dial-center-hour').textContent=`${h12}:${String(dm).padStart(2,'0')}`;
    document.getElementById('dial-center-period').textContent=dh<12?'AM':'PM';
    drawDial(nd);
    dialRAF=requestAnimationFrame(step);
  }
  dialRAF=requestAnimationFrame(step);
}

// ── Clock digit animation ──
let prevClockStr='';
function renderClock(date) {
  const hh=String(date.getHours()).padStart(2,'0');
  const mm=String(date.getMinutes()).padStart(2,'0');
  const newStr=`${hh}:${mm}`;
  const el=document.getElementById('clock-display');
  if(newStr===prevClockStr && el.children.length>0) return;
  prevClockStr=newStr;
  el.innerHTML='';
  [...newStr].forEach((ch,i)=>{
    if(ch===':'){
      const sep=document.createElement('span');
      sep.textContent=':'; sep.style.display='inline-block';
      el.appendChild(sep);
    } else {
      const wrap=document.createElement('span');
      wrap.className='digit-wrap';
      const inner=document.createElement('span');
      inner.className='digit-inner';
      inner.textContent=ch;
      inner.style.animationDelay=`${i*30}ms`;
      wrap.appendChild(inner);
      el.appendChild(wrap);
    }
  });
}

// ── Animate verdict text ──
function animateVerdict(el, text) {
  el.innerHTML='';
  const span=document.createElement('span');
  span.className='vflip';
  span.textContent=text;
  el.appendChild(span);
}

// ── Animate icon draw ──
function animateIcon(svgEl, html) {
  svgEl.innerHTML=html;
  svgEl.classList.remove('draw');
  void svgEl.offsetWidth; // reflow
  svgEl.classList.add('draw');
}

// ── Animate type label ──
function animateLabel(el, text) {
  el.classList.remove('slide-in');
  void el.offsetWidth;
  el.textContent=text;
  el.classList.add('slide-in');
}

// ── Animate tasting text ──
function animateTasting(el, text) {
  el.classList.remove('fade-in');
  el.style.opacity='0';
  setTimeout(()=>{
    el.textContent=text;
    el.style.opacity='';
    el.classList.add('fade-in');
  }, 120);
}

// ── Animate moon ──
function animateMoon(svgEl, phaseKey) {
  svgEl.innerHTML=moonSVG(phaseKey);
  svgEl.classList.remove('spin-in');
  void svgEl.offsetWidth;
  svgEl.classList.add('spin-in');
}

// ── Flash card border ──
function flashCard(card) {
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
  setTimeout(()=>card.classList.remove('flash'),700);
}

// ── Build week strip with stagger ──
function buildWeekStrip(current) {
  const strip=document.getElementById('week-strip');
  strip.innerHTML='';
  const ws=new Date(current); ws.setDate(ws.getDate()-ws.getDay());
  for(let i=0;i<7;i++){
    const d=new Date(ws); d.setDate(ws.getDate()+i);
    const lun=getLunarData(d);
    const today=d.toDateString()===current.toDateString();
    const div=document.createElement('div');
    div.className=`week-day${today?' active':''}`;
    div.style.animationDelay=`${i*45}ms`;
    div.style.animationFillMode='both';
    div.style.animation=`wdIn 0.35s ${i*45}ms cubic-bezier(0.23,1,0.32,1) both`;
    div.innerHTML=`<div class="wd-name">${DAYS_SHORT[d.getDay()].slice(0,2)}</div><div class="wd-num">${d.getDate()}</div><svg class="wd-icon-wrap" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">${smallIconSVG(lun.dayType)}</svg>`;
    div.addEventListener('click',()=>{
      const nd=new Date(state.dialDate);
      nd.setFullYear(d.getFullYear(),d.getMonth(),d.getDate());
      state.dialDate=nd;
      currentHours=nd.getHours()+nd.getMinutes()/60;
      updateUI(state.dialDate);
    });
    strip.appendChild(div);
  }
}

// ── Full UI update ──
function updateUI(date) {
  const lunar=getLunarData(date);
  const cfg=DAY_CONFIG[lunar.dayType];
  const n=state.now;
  const typeChanged = lunar.dayType !== lastType;
  const phaseChanged = lunar.phaseKey !== lastPhaseKey;

  // Clock
  renderClock(n);
  document.getElementById('day-name-display').textContent=DAYS_FULL[n.getDay()].toUpperCase();
  document.getElementById('date-display').textContent=`${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;

  // Moon (animate only when phase changes)
  const moonSvgEl=document.getElementById('moon-phase-svg');
  if(phaseChanged){
    animateMoon(moonSvgEl, lunar.phaseKey);
    document.getElementById('moon-phase-text').textContent=lunar.phase;
    lastPhaseKey=lunar.phaseKey;
  }

  // Result card
  const card=document.getElementById('result-card');
  const isGood=lunar.dayType==='fruit'||lunar.dayType==='flower';

  if(typeChanged){
    card.className=`result-block ${lunar.dayType}`;
    flashCard(card);

    // Icon draw-in
    const iconEl=document.getElementById('result-icon-svg');
    animateIcon(iconEl, dayIconSVG(lunar.dayType));

    // Label slide
    animateLabel(document.getElementById('result-type-label'), cfg.label);
    document.getElementById('result-corner').textContent=cfg.corner;

    // Verdict flip
    const vEl=document.getElementById('verdict-main');
    vEl.className=`verdict-word${isGood?'':' avoid'}`;
    animateVerdict(vEl, cfg.verdict);

    // Sub text
    const subEl=document.getElementById('verdict-sub');
    subEl.classList.add('hide');
    setTimeout(()=>{ subEl.textContent=cfg.sub; subEl.classList.remove('hide'); }, 200);

    // Tasting note
    const pool=NOTES[lunar.dayType];
    animateTasting(document.getElementById('notes-text'), pool[Math.floor(date.getTime()/86400000)%pool.length]);

    lastType=lunar.dayType;
  } else {
    // Non-type-change — still update label/corner/verdict text
    card.className=`result-block ${lunar.dayType}`;
    document.getElementById('result-icon-svg').innerHTML=dayIconSVG(lunar.dayType);
    document.getElementById('result-type-label').textContent=cfg.label;
    document.getElementById('result-corner').textContent=cfg.corner;
    const vEl=document.getElementById('verdict-main');
    vEl.textContent=cfg.verdict; vEl.className=`verdict-word${isGood?'':' avoid'}`;
    document.getElementById('verdict-sub').textContent=cfg.sub;
    const pool=NOTES[lunar.dayType];
    document.getElementById('notes-text').textContent=pool[Math.floor(date.getTime()/86400000)%pool.length];
  }

  // Dial center
  const dh=date.getHours(),dm=date.getMinutes(),h12=dh%12||12;
  document.getElementById('dial-center-day').textContent=DAYS_SHORT[date.getDay()];
  document.getElementById('dial-center-hour').textContent=`${h12}:${String(dm).padStart(2,'0')}`;
  document.getElementById('dial-center-period').textContent=dh<12?'AM':'PM';

  drawDial(date);
  buildWeekStrip(date);
}

// ── Drag (inertia version) ──
let dragging=false;
function getAngle(e,rect){const cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;return Math.atan2(cy-rect.top-rect.height/2,cx-rect.left-rect.width/2)+Math.PI/2;}
function inRing(e,rect){const cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY,dx=cx-rect.left-rect.width/2,dy=cy-rect.top-rect.height/2,dist=Math.sqrt(dx*dx+dy*dy)/(rect.width/SZ);return dist>(RI-38)&&dist<(RO+12);}
DC.addEventListener('mousedown',e=>{if(inRing(e,DC.getBoundingClientRect())){dragging=true;document.addEventListener('mousemove',onDrag);document.addEventListener('mouseup',endDrag);}});
DC.addEventListener('touchstart',e=>{if(inRing(e,DC.getBoundingClientRect())){dragging=true;document.addEventListener('touchmove',onDrag,{passive:false});document.addEventListener('touchend',endDrag);}},{passive:true});

function onDrag(e){
  if(!dragging) return;
  if(e.preventDefault) e.preventDefault();
  const rect=DC.getBoundingClientRect();
  const h=(((getAngle(e,rect)/(Math.PI*2))*24)+24)%24;
  const nd=new Date(state.dialDate);
  nd.setHours(Math.floor(h),Math.floor((h%1)*60),0,0);
  state.dialDate=nd;
  // Track current for inertia
  currentHours=h;
  targetHours=h;
  // Trigger full UI update (type detection)
  updateUI(state.dialDate);
}

function endDrag(){
  dragging=false;
  document.removeEventListener('mousemove',onDrag);
  document.removeEventListener('touchmove',onDrag);
  document.removeEventListener('mouseup',endDrag);
  document.removeEventListener('touchend',endDrag);
}

// ── Geolocation ──
navigator.geolocation&&navigator.geolocation.getCurrentPosition(
  p=>fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.coords.latitude}&lon=${p.coords.longitude}&format=json`)
    .then(r=>r.json())
    .then(d=>{const c=d.address.city||d.address.town||d.address.village||'';const cc=d.address.country_code?d.address.country_code.toUpperCase():'';document.getElementById('location-display').textContent=c?`${c}, ${cc}`:cc;})
    .catch(()=>{}),
  ()=>{},{timeout:8000}
);

// ── Canvas breathing pulse (rAF loop) ──
function breathLoop(){
  breathT+=0.012;
  // We re-draw the dial on a slow breath if not dragging
  if(!dragging){
    // subtle: just update the center glow alpha on the canvas
    // Full redraw only every ~4 frames for performance
    if(Math.round(breathT*100)%4===0){
      drawDial(state.dialDate);
    }
  }
  requestAnimationFrame(breathLoop);
}

// ── Init ──
state.now=new Date();
state.dialDate=new Date(state.now);
currentHours=state.dialDate.getHours()+state.dialDate.getMinutes()/60;
targetHours=currentHours;
// Force first-render as "type changed" so all animations fire on load
lastType=null; lastPhaseKey=null;
updateUI(state.dialDate);
// Trigger initial icon draw after short delay (lets layout settle)
setTimeout(()=>{
  const iconEl=document.getElementById('result-icon-svg');
  animateIcon(iconEl, iconEl.innerHTML);
  const moonEl=document.getElementById('moon-phase-svg');
  animateMoon(moonEl, getLunarData(state.dialDate).phaseKey);
  const vEl=document.getElementById('verdict-main');
  animateVerdict(vEl, vEl.textContent);
}, 400);
setInterval(()=>{state.now=new Date();renderClock(state.now);},30000);
requestAnimationFrame(breathLoop);
</script>
</body>
</html>
